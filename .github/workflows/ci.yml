name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests y lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite runs here without PortAudio on purpose: the audio engine, the
      # detector and the Realtime client all sit behind interfaces with test
      # doubles, so a runner with no sound card still exercises them.
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Lint
        working-directory: backend
        run: python -m ruff check src tests

  frontend:
    name: Frontend (tests, tipos y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Tipos y build
        working-directory: frontend
        run: npm run build

  shell:
    name: Shell de escritorio (compilación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias del sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Frontend para el contexto de Tauri
        working-directory: frontend
        run: npm ci && npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  wakeword:
    name: Modelo de la palabra de activación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Training is deterministic given the script, so a rebuild only costs
      # time when the recipe itself changes.
      - name: Caché del modelo
        id: cache
        uses: actions/cache@v4
        with:
          path: data/models
          key: >-
            wakeword-${{ hashFiles('scripts/train_wakeword.py',
            'scripts/fetch_wakeword_runtime.py',
            'backend/src/aiclassroom/voice/training.py') }}

      - name: Dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install --upgrade pip
          pip install -e "./backend[train]"

      - name: Descargar el extractor de características
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_wakeword_runtime.py --output data/models

      # Trained on synthesized voices: enough to bring the chain up and try the
      # application, not enough for a classroom. Retrain with recordings of
      # real people before relying on it (see docs/decisiones-tecnicas.md, R-1).
      - name: Entrenar el detector
        if: steps.cache.outputs.cache-hit != 'true'
        run: python scripts/train_wakeword.py --phrase "Oye Chat" --models data/models

      - uses: actions/upload-artifact@v4
        with:
          name: wakeword-models
          path: data/models
          if-no-files-found: error

  portable:
    name: Carpeta portable para Windows
    runs-on: windows-latest
    needs: [backend, frontend, shell, wakeword]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Empaquetar el backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[wakeword]" pyinstaller
          python -m PyInstaller aiclassroom-backend.spec --noconfirm --clean

      # The first real check of D-02: the frozen executable must start on a
      # machine with no Python, and it must carry PortAudio -- an application
      # that cannot open a microphone is useless in a classroom, and finding
      # that out here costs minutes instead of a lesson.
      - name: Comprobar el ejecutable empaquetado
        working-directory: backend
        run: |
          $env:AICLASSROOM_DATA_DIR = "$env:RUNNER_TEMP\selftest"
          .\dist\backend\aiclassroom-backend.exe --selftest --require-audio --require-wakeword --require-training
          if ($LASTEXITCODE -ne 0) { throw "El backend empaquetado no supera el autotest." }

      - name: Construir el frontend
        working-directory: frontend
        run: npm ci && npm run build

      # Without custom-protocol Tauri compiles in dev mode and the window loads
      # devUrl (localhost:1420) instead of the embedded interface: the window
      # opens on ERR_CONNECTION_REFUSED. `cargo tauri build` adds it on its own;
      # plain cargo does not (P-11).
      - name: Construir el shell
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol

      # Built by the Linux job, so the classroom PC never downloads or trains
      # anything (D-04).
      - name: Recoger los modelos del detector
        uses: actions/download-artifact@v4
        with:
          name: wakeword-models
          path: release\AI-Classroom-Live\data\models

      - name: Montar la carpeta portable
        run: |
          $staging = "release\AI-Classroom-Live"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item src-tauri\target\release\ai-classroom-live.exe `
                    "$staging\AI-Classroom-Live.exe"
          New-Item -ItemType Directory -Force -Path "$staging\runtime" | Out-Null
          Copy-Item backend\dist\backend "$staging\runtime" -Recurse
          foreach ($folder in @("config", "materials", "sessions", "metrics", "models")) {
            New-Item -ItemType Directory -Force -Path "$staging\data\$folder" | Out-Null
          }
          Copy-Item docs\README-portable.txt "$staging\README.txt"

      # Runs the packaged backend from inside the portable layout, which is the
      # only place the data folder resolves the way the teacher will see it.
      - name: Comprobar la carpeta portable
        run: |
          $backend = "release\AI-Classroom-Live\runtime\backend\aiclassroom-backend.exe"
          $output = & $backend --selftest --require-audio --require-wakeword --require-training
          if ($LASTEXITCODE -ne 0) { throw "La carpeta portable no supera el autotest." }
          Write-Host $output
          $report = $output | ConvertFrom-Json
          $expected = (Resolve-Path "release\AI-Classroom-Live\data").Path
          if ($report.data_dir -ne $expected) {
            throw "El backend usa $($report.data_dir) en lugar de $expected."
          }
          if (-not $report.frozen) { throw "El ejecutable no está empaquetado." }

          foreach ($model in @("melspectrogram.onnx", "embedding_model.onnx", "silero_vad.onnx")) {
            $path = "release\AI-Classroom-Live\data\models\openwakeword\$model"
            if (-not (Test-Path $path)) { throw "Falta el modelo base $model." }
          }
          if (-not (Test-Path "release\AI-Classroom-Live\data\models\oye_chat.onnx")) {
            throw "Falta el modelo de la frase: la carpeta no detectaría nada."
          }
          if (-not (Test-Path "release\AI-Classroom-Live\data\models\oye_chat.corpus.npz")) {
            throw "Falta el corpus base: no se podría entrenar con la voz del profesor (D-12)."
          }

          $size = (Get-ChildItem "release\AI-Classroom-Live" -Recurse -File |
                   Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Tamano de la carpeta portable: {0:N0} MB" -f $size)

      # Risk R-7: the build is unsigned, so whoever downloads the artifact has
      # no way to tell it arrived intact. A checksum file is the minimum.
      - name: Sumas de verificación
        run: |
          $staging = "release\AI-Classroom-Live"
          $checksums = "$staging\SHA256SUMS.txt"
          Get-ChildItem $staging -Recurse -File |
            Where-Object { $_.FullName -ne $checksums } |
            ForEach-Object {
              $relative = $_.FullName.Substring((Resolve-Path $staging).Path.Length + 1)
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $relative
            } | Set-Content $checksums -Encoding ASCII
          Write-Host "$((Get-Content $checksums).Count) archivos con suma de verificacion."

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Classroom-Live-portable
          path: release/AI-Classroom-Live
          if-no-files-found: error
