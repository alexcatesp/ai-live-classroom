[project]
name = "aiclassroom"
version = "0.1.0"
description = "AI Classroom Live - local backend (Phase 0)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "websockets>=13.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.5",
    # AES-GCM for the passphrase-protected API key (risk R-5).
    "cryptography>=43.0",
]

[project.optional-dependencies]
# Bundled in the portable build; separate so the tests can run without the
# ONNX runtime on a machine that only lints.
# scikit-learn and onnx are what "Entrenar con mi voz" trains and exports with
# (D-12), so they ship too; scikit-learn would arrive through openwakeword
# anyway, but the application now uses it directly.
wakeword = ["openwakeword>=0.6.0", "scikit-learn>=1.4", "onnx>=1.16"]
# Only for scripts/train_wakeword.py, which runs on a build machine and never
# ships. scikit-learn and scipy arrive with openwakeword, but are named here
# too: the trainer uses them directly and should not depend on somebody else's
# transitive dependency staying put.
train = [
    "openwakeword>=0.6.0",
    "onnx>=1.16",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
aiclassroom-backend = "aiclassroom.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:aiclassroom.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
